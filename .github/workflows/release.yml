name: release

# Cut a release by pushing a signed tag: `git tag -s v0.1.0 -m ... && git push origin v0.1.0`. The
# SSH signing key is registered on the maintainer's GitHub account, so the tag reads as Verified.
# Publishing uses PyPI Trusted Publishing (OIDC) -- no stored token. One-time PyPI-side setup:
# add this repo + the `release.yml` workflow + the `pypi` environment as a trusted publisher.
#
# The `github-release` job exists because Zenodo archives on GitHub's `release` event and ignores tag
# pushes entirely. Without it the tag reaches PyPI, no Release object is ever created, and the
# Zenodo hook stays silent -- so the DOI the preprint cites would never be minted. It runs last, on
# purpose: a Release is the claim that this version is actually out, and PyPI is the step that can
# still fail.

on:
  push:
    tags: ["v*"]

# Nothing by default: each job below names exactly the scopes it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # OIDC token for the build-provenance attestation
      attestations: write # write it back to this repository's attestation store
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        # setup-uv has published no moving major/minor tags since v8.0.0, so there is no major tag
        # to track: the pin is a release commit itself.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          # the floor, not the newest: the wheel is `py3-none-any`, so the build interpreter does not
          # reach the artefact, and building on the oldest supported one is what keeps that true
          python-version: "3.11"
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      # SLSA build provenance, and it is a *different* claim from the PEP 740 attestation the
      # publish job makes. PyPI's says "this file was uploaded by this workflow"; this one says
      # "this file was built from this commit, by this workflow, on this runner", and it is
      # verifiable with `gh attestation verify` without going through PyPI at all. A reader who
      # distrusts the index needs the second one.
      - name: Attest the build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"
      # The same attestation as a Release asset, so the provenance can be checked from the release
      # page alone, with no attestation API and no GitHub login:
      #   gh attestation verify <file> --bundle <bundle> --repo causaldyn/causal-hybrid-control
      # The file is a Sigstore bundle covering the wheel and the sdist, so it takes Sigstore's own
      # extension, `.sigstore.json`, which Scorecard's Signed-Releases check also recognises; not
      # `.intoto.jsonl`, whose in-toto layout is one bare DSSE envelope per line. Checked against both
      # files here, so a bundle that does not verify stops the release before anything is published.
      - name: Stage and check the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir provenance
          bundle="provenance/causal-hybrid-control-$version.provenance.sigstore.json"
          cp "$BUNDLE" "$bundle"
          for f in dist/*; do
            gh attestation verify "$f" --bundle "$bundle" --repo "$GITHUB_REPOSITORY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: provenance
          path: provenance/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
      # CycloneDX from the lockfile the tests ran against, so the bill of materials names what was
      # tested rather than what the wheel's version ranges would resolve to today. Kept out of
      # `dist/`: the publish job uploads everything in there to PyPI, and PyPI rejects a JSON file.
      # Both lockfile forks are listed (numpy, scipy, jax and jaxlib resolve one way on Python 3.11
      # and another from 3.12); that is the lockfile's truth, not a duplicate. The format is a uv
      # preview feature: if uv changes it, this step fails before anything is published.
      - name: Export the SBOM
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir sbom
          uv export --format cyclonedx1.5 --preview-features sbom-export --frozen --no-dev \
            --output-file "sbom/causal-hybrid-control-$version.cdx.json"
          jq -e --arg v "$version" '.metadata.component.version == $v' sbom/*.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the Release object; Zenodo's webhook keys off it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
          path: sbom/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: provenance
          path: provenance/
      # The notes are the changelog section for this version, not a pointer to it. A release page
      # that says "see CHANGELOG.md" makes the reader leave to find out what they just installed,
      # and the Zenodo record -- which copies this body -- would archive the pointer rather than
      # the content. Extracted rather than hand-written so the two cannot drift.
      - name: Build the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## [$version]" '
            index($0, v) == 1 { found = 1 }
            found && /^## \[/ && index($0, v) != 1 { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## [$version]' section -- refusing to publish empty notes"
            exit 1
          fi
          # GitHub caps a release body at 125 000 characters and rejects the call outright above it.
          if [ "$(wc -c < notes.md)" -gt 120000 ]; then
            head -c 119000 notes.md > notes.trimmed
            printf '\n\n_Truncated; the full entry is in [CHANGELOG.md](CHANGELOG.md)._\n' \
              >> notes.trimmed
            mv notes.trimmed notes.md
          fi
          wc -c notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* sbom/* provenance/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

  # The documentation for the version just released, deployed from its tag. Called rather than
  # triggered: the Release above was created with this run's own token, and GitHub starts no
  # workflow from an event that token raised, so docs.yml's `release` trigger would never fire.
  docs:
    needs: github-release
    permissions:
      contents: read
      pages: write     # the called deploy job publishes the artifact
      id-token: write  # and proves the deployment came from this repository's workflow
    uses: ./.github/workflows/docs.yml
