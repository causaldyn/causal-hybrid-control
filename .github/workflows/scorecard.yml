name: scorecard

# OpenSSF Scorecard grades the supply chain rather than the code: are actions pinned, is a branch
# protected, is publishing tokenless, are dependencies watched. It is the only check here that
# reports on the *repository* instead of on what is in it.
on:
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload the SARIF to the Security tab
      id-token: write         # sign the results so the badge is verifiable
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Signs the result and publishes it so the README badge resolves. It publishes the score
          # and the check names, not the source.
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: results.sarif
