name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Matrixed like `test`, and for a reason ruff alone would not justify: with the floor at 3.11 the
  # resolver forks, so `ty` reads numpy 2.4.6's stubs below 3.12 and 2.5.1's at or above it. The two
  # disagree about what is well-typed, and a single-version lint job would let whichever half a
  # developer's own interpreter is not report clean right up to the push.
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # Pinned to a full version, not `@v9`: setup-uv dropped its moving major/minor tags in
        # v8.0.0, so `@v9` does not resolve. The other actions here still publish them.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Tests
        run: uv run pytest

  # The formal claims are gated like the Python ones: every docstring that cites a Rocq lemma is only
  # as good as the file still compiling. Pinned to 9.2 because the proofs use the post-rename
  # `From Stdlib Require Import`, which does not exist before Rocq 9.0.
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile every proof
        # Read-only mount, sources copied into the container's /tmp: the image runs as uid 1000
        # while the runner owns the workspace, and `rocq compile` writes .vo/.glob next to its input.
        # `bash -lc` is required -- rocq lives in the image's opam switch, not on the default PATH.
        run: |
          docker run --rm -v "$PWD/proofs:/proofs:ro" rocq/rocq-prover:9.2 bash -lc '
            set -euo pipefail
            mkdir /tmp/proofs && cp /proofs/*.v /tmp/proofs/ && cd /tmp/proofs
            for f in *.v; do rocq compile -q "$f"; done
            echo "compiled $(ls -1 *.vo | wc -l) proofs"'

  # The matrix lifts in proofs/mathcomp/ need MathComp, which the plain Rocq image does not carry.
  # Unlike the Stdlib proofs they are stated over abstract MathComp fields, not over Stdlib's
  # axiomatic reals, so every lemma must print "Closed under the global context": the audit counts
  # those lines against the lemma count and fails on any axiom or admitted step.
  proofs-mathcomp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile and audit the MathComp lifts
        # Same container discipline as `proofs`: read-only mount, sources copied into /tmp, and
        # `bash -lc` so the image's opam switch is on PATH.
        run: |
          docker run --rm -v "$PWD/proofs/mathcomp:/proofs:ro" mathcomp/mathcomp:2.6.0-rocq-prover-9.2 bash -lc '
            set -euo pipefail
            mkdir /tmp/proofs /tmp/audit && cp /proofs/*.v /tmp/proofs/ && cd /tmp/proofs
            for f in *.v; do rocq compile -q "$f"; done
            echo "compiled $(ls -1 *.vo | wc -l) MathComp proofs"
            expected=0
            for f in *.v; do
              names=$(grep -oP "^\s*(Lemma|Theorem|Corollary|Proposition)\s+\K[A-Za-z_][A-Za-z0-9_\x27]*" "$f" || true)
              [ -z "$names" ] && continue
              cp "$f" /tmp/audit/
              for n in $names; do echo "Print Assumptions $n." >> "/tmp/audit/$f"; expected=$((expected + 1)); done
            done
            cd /tmp/audit
            for f in *.v; do rocq compile -q "$f" >> /tmp/audit.out 2>&1 || { cat /tmp/audit.out; exit 1; }; done
            closed=$(grep -c "^Closed under the global context$" /tmp/audit.out || true)
            if [ "$closed" -ne "$expected" ] || grep -qE "^Axioms:|Admitted" /tmp/audit.out; then
              cat /tmp/audit.out; echo "$closed of $expected lemmas closed under the global context"; exit 1
            fi
            echo "$closed lemmas closed under the global context"'

  # The CAS half of every result was gated exactly once -- by hand, in the session that wrote it.
  # Three derivations were consequently dead from their first commit to 2026-09-01. `maxima -b` exits 0
  # on a parse error and still echoes the batch filename, so `run_all.sh` greps the output instead.
  # The runner's apt Maxima is older than the 5.50 used locally; the check is completion-only, not an
  # output comparison, so minor version drift is tolerated -- and a version-induced failure is itself
  # worth surfacing.
  derivations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Maxima
        # maxima-share is a Recommends, so --no-install-recommends silently drops the share tree
        # that provides eigenvalues, mat_trace, kronecker_product and the loadable packages.
        run: sudo apt-get update && sudo apt-get install -y maxima maxima-share
      - name: Run every derivation
        run: ./validation/run_all.sh

  # The site shows what the code prints, so building it means running the code: `docs/build.sh`
  # executes the eight notebooks and the scripts the pages quote, then builds with `--strict`. Run
  # here, a library change that breaks a tutorial fails its own PR rather than the release deploy,
  # which runs the same script.
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Sync dependencies
        run: uv sync --group docs --group notebooks
      - name: Execute the notebooks and scripts, then build the site
        run: ./docs/build.sh
