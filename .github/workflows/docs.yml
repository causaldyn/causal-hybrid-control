name: docs

# Publish the documentation site to GitHub Pages. The build is `docs/build.sh`, the script ci.yml's
# `docs` job runs on every push and pull request.
#
# release.yml calls this as its last job. Listening for `release: published` alone would never fire
# for those releases: release.yml creates the Release with its own GITHUB_TOKEN, and GitHub starts no
# workflow run from an event that token raised. The `release` trigger stays for a Release created by
# hand, and `workflow_dispatch` for redeploying without one.
on:
  workflow_call:
  release:
    types: [published]
  workflow_dispatch:

# Nothing by default: each job below names exactly the scopes it needs.
permissions: {}

# One deployment at a time, and never cancelled halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read  # configure-pages reads the site's settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Before the build, so a repository without Pages enabled fails here rather than after it.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Install uv
        # setup-uv has published no moving major/minor tags since v8.0.0, so there is no `@v9` to
        # track: the pin is the v9.0.0 release commit itself.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Sync dependencies
        run: uv sync --group docs --group notebooks
      - name: Execute the notebooks and scripts, then build the site
        run: ./docs/build.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # publish the uploaded artifact
      id-token: write  # OIDC token that proves the deployment came from this workflow
    # A release run deploys from its tag, not from a branch: if the environment restricts which refs
    # may deploy, its rule has to admit the `v*` tags.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
