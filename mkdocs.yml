site_name: causal-hybrid-control
site_url: https://causaldyn.github.io/causal-hybrid-control/
site_description: >-
  Physics-structured dynamics with a learned causal residual, controlled by constrained optimal
  control / MPC.
repo_url: https://github.com/causaldyn/causal-hybrid-control

theme:
  name: material
  font: false  # system fonts, so a page view sends no request to Google Fonts
  features:
    - content.code.copy
    - navigation.indexes

# Not pages. The ADRs quote prototype measurements that no committed routine reprints, so the site
# links them on GitHub rather than publishing them; output/ is what `docs/build.sh` prints for the
# pages to include; the scripts are the build's own code.
exclude_docs: |
  adr/
  output/
  *.py
  *.sh

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

hooks:
  - docs/hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            # A few docstrings document two parameters in one entry (`unit, time: ...`), which the
            # Google parser renders but cannot match to the signature; without these two it warns
            # on each, and a strict build fails on a style the library never adopted.
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false
            show_source: false
            show_root_heading: false
            heading_level: 2
            members_order: source

