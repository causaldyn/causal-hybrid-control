[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "chc-runtime"
version = "0.0.1"
description = "Rust runtime for Causal Hybrid Control (RK4 + discrete adjoint + projected-gradient OC)."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.maturin]
features = ["python"]
module-name = "chc_runtime"
