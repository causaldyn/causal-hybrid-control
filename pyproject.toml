[project]
name = "causal-hybrid-control"
version = "0.14.0"
description = "Physics-structured dynamics with a learned causal residual, controlled by constrained optimal control / MPC."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ilia Gradina", email = "ilia.gradina@gmail.com" }]
keywords = [
    "causal-inference",
    "optimal-control",
    "mpc",
    "scientific-machine-learning",
    "hybrid-models",
    "system-identification",
    "jax",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "jax>=0.4.30",
    "diffrax>=0.6",
    "optax>=0.2.3",
    "equinox>=0.11.4",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
# gradient-boosted surrogate dynamics for Track A/B baselines (chc.surrogate). Optional: the core
# library is pure-JAX. econml/dowhy are deliberately NOT here -- econml brings numba, sparse,
# statsmodels, shap and lightgbm for one adapter, and dowhy declares Python <3.14 -- so their adapters
# (chc.estimators) are lazy-import, bring-your-own-env instead.
trees = [
    "lightgbm>=4",
    # 1.2.8 is the first catboost that loads beside numpy 2: 1.2.6 and 1.2.7 declare numpy<2, and
    # the releases before them declare no cap and fail at import
    "catboost>=1.2.8",
    "scikit-learn>=1.4",  # lightgbm's sklearn API needs sklearn
]
# difference-in-differences inference for chc.did: Callaway-Sant'Anna's multiplier bootstrap and
# Rambachan-Roth, lazily imported; below 4, since a major release may move the results it reads.
# diff-diff declares Python below 3.15, so on 3.15 the extra is empty and the inference raises.
did = ["diff-diff>=3.12,<4 ; python_version < '3.15'"]
# JAX's build for an accelerator, chosen at install time: `pip install "causal-hybrid-control[cuda13]"`.
# Each extra is JAX's own of the same name, which pins jaxlib and the plugin to jax's version, so
# the two cannot drift apart, from the first jax that has it: a jax without the extra installs it
# as nothing, with a warning. The CUDA, ROCm, TPU and oneAPI builds are Linux wheels.
cpu = ["jax[cpu]"]
cuda13 = ["jax[cuda13]>=0.7"]  # NVIDIA driver >= 580, GPUs of compute capability 7.5 or newer
cuda12 = ["jax[cuda12]"]  # NVIDIA driver >= 525
cuda13-local = ["jax[cuda13-local]>=0.7"]  # CUDA 13 installed on the system rather than from wheels
cuda12-local = ["jax[cuda12-local]"]
rocm7-local = ["jax[rocm7-local]>=0.9.2"]  # AMD GPUs; ROCm 7 installed on the system
tpu = ["jax[tpu]"]  # Google Cloud TPU VMs
oneapi = ["jax[oneapi]>=0.11 ; python_version >= '3.12'"]  # Intel GPUs; no oneAPI build for 3.11

[project.urls]
Homepage = "https://github.com/causaldyn/causal-hybrid-control"
Documentation = "https://causaldyn.github.io/causal-hybrid-control/"
Repository = "https://github.com/causaldyn/causal-hybrid-control"
Issues = "https://github.com/causaldyn/causal-hybrid-control/issues"
Changelog = "https://github.com/causaldyn/causal-hybrid-control/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "ty>=0.0.61",
    # chc.frames accepts either frame library structurally and depends on neither; both are here so
    # tests/test_frames.py can prove the two agree with each other and with a plain mapping. 2.2.2 is
    # the first pandas that loads beside numpy 2; 2.0 declares no cap on numpy, so a resolver would
    # pair the two.
    "pandas>=2.2.2",
    "polars>=1.0",
    "pytest-xdist>=3.8.0",
    # the did extra, so that CI runs chc.did's inference tests where diff-diff installs
    "diff-diff>=3.12,<4 ; python_version < '3.15'",
]
viz = ["matplotlib>=3.8"]
notebooks = [
    "jupyterlab>=4.0",
    "nbconvert>=7",
    "ipykernel>=6",
    "jupytext>=1.16",
    "matplotlib>=3.8",
    "pandas>=2.2.2",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.uv]
# One accelerator per environment: two plugins would both claim the device.
conflicts = [
    [
        { extra = "cuda13" },
        { extra = "cuda12" },
        { extra = "cuda13-local" },
        { extra = "cuda12-local" },
        { extra = "rocm7-local" },
        { extra = "tpu" },
        { extra = "oneapi" },
    ],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chc"]

# An allow-list, not the default "everything git does not ignore": the sdist is part of the
# claim -- it carries the Rocq proofs and the Maxima derivations the docstrings cite -- and it
# must not vary with what is lying in a contributor's working tree. Before this, a local
# `.venv311` (outside the `.venv/` pattern) and `.hypothesis/` turned a 1 MB artefact into a
# 226 MB one that failed to build a wheel. Contents reproduce the published 0.3.0 sdist.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/fuzz",
    "/proofs",
    "/validation",
    "/notebooks",
    "/scripts",
    "/docs",
    "/.github",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/SECURITY.md",
    "/justfile",
    "/mkdocs.yml",
    "/pyproject.toml",
    "/uv.lock",
    "/.gitignore",
    "/.python-version",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]  # notebook sources carry cell magics / non-import layout

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PERF", "PIE", "PT", "PTH", "RET", "FURB"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# a name the top level only serves with a warning is the library's own to stop using first
filterwarnings = ["error:chc\\.\\w+ leaves the top level:DeprecationWarning"]

[tool.ty.environment]
# The interpreter `.python-version` pins, not the floor: ty reads the environment's stubs at this
# version, and a target below the environment reads them on a branch they were never written for
# -- at 3.11, numpy 2.5's, which requires 3.12, made ty 0.0.67 onwards reject `.min()` on a float64
# array. ci.yml's lint legs and `just types-matrix` pass each interpreter's own version, the 3.11
# leg holding the floor.
python-version = "3.14"

[tool.ty.src]
include = ["src/chc"]

[tool.ty.rules]
# the optional bring-your-own-env adapters (econml / dowhy / tigramite / lightgbm / catboost) are
# intentionally uninstalled; their imports are lazy and ImportError-guarded, not bugs to flag
unresolved-import = "ignore"
