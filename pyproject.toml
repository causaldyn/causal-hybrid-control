[project]
name = "causal-hybrid-control"
version = "0.1.0"
description = "Physics-structured dynamics with a learned causal residual, controlled by constrained optimal control / MPC."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Ilia Gradina", email = "ilia.gradina@gmail.com" }]
keywords = [
    "causal-inference",
    "optimal-control",
    "mpc",
    "scientific-machine-learning",
    "hybrid-models",
    "system-identification",
    "jax",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "jax>=0.4.30",
    "diffrax>=0.6",
    "optax>=0.2.3",
    "equinox>=0.11.4",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
# gradient-boosted surrogate dynamics for Track A/B baselines (chc.surrogate). Optional: the core
# library is pure-JAX. econml/dowhy are deliberately NOT here -- they do not resolve on Python 3.12 +
# pandas 3, so their adapters (chc.estimators) are lazy-import, bring-your-own-env instead.
trees = ["lightgbm>=4", "catboost>=1.2", "scikit-learn>=1.4"]  # lightgbm's sklearn API needs sklearn

[project.urls]
Homepage = "https://github.com/ilgrad/causal-hybrid-control"
Repository = "https://github.com/ilgrad/causal-hybrid-control"
Issues = "https://github.com/ilgrad/causal-hybrid-control/issues"
Changelog = "https://github.com/ilgrad/causal-hybrid-control/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "ty>=0.0.61",
]
viz = ["matplotlib>=3.8"]
notebooks = [
    "jupyterlab>=4.0",
    "nbconvert>=7",
    "ipykernel>=6",
    "jupytext>=1.16",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chc"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]  # notebook sources carry cell magics / non-import layout

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PERF", "PIE", "PT", "PTH", "RET", "FURB"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src/chc"]

[tool.ty.rules]
# the optional bring-your-own-env adapters (econml / dowhy / tigramite / lightgbm / catboost / pandas)
# are intentionally uninstalled; their imports are lazy and ImportError-guarded, not bugs to flag
unresolved-import = "ignore"
